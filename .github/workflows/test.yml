name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Consistency checks
        run: node scripts/check.mjs
      - name: Type check
        run: |
          npm ci
          npm run typecheck
      - name: Tests
        run: node --test
      - name: Store zip builds
        run: bash scripts/build-store-zip.sh

  windows:
    # The Windows copy helper's tests only run here; the rest run again on Windows too.
    # (The clipboard test stays off: it needs CLIPSNATCHER_CLIPBOARD_TEST=1 and a desktop.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: node --test
