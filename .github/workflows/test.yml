name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Consistency checks
        run: node scripts/check.mjs
      - name: Type check
        run: |
          npm ci
          npm run typecheck
      - name: Tests
        run: node --test
      - name: Store zip builds
        run: bash scripts/build-store-zip.sh

  windows:
    # The Windows copy helper's tests only run here; the rest run again on Windows too.
    # (The clipboard test stays off: it needs CLIPSNATCHER_CLIPBOARD_TEST=1 and a desktop.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests
        run: node --test
