name: Release

# Pushing a version tag (v1.6.0) publishes a GitHub release with the store zip and the two
# copy helper downloads that Settings links to (releases/latest/download/...). A tag that
# was pushed before can be published by hand from the Actions tab, as long as it has
# scripts/build-helper-zips.sh (tags from 1.6.0 on).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag to publish, like v1.6.0
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tag matches the extension's version
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG doesn't match manifest version $version" >&2; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Checks and tests
        run: |
          node scripts/check.mjs
          npm ci
          npm run typecheck
          node --test
      - name: Build the store zip and the helper downloads
        run: |
          bash scripts/build-store-zip.sh
          bash scripts/build-helper-zips.sh
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/clipsnatcher-$VERSION.zip" dist/clipsnatcher-helper-macos.zip dist/clipsnatcher-helper-windows.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "ClipSnatcher $VERSION" --notes-file release-notes.md
          fi
