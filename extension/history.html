<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipSnatcher History</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="ui.css">
<style>
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 72px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .brand img { width: 26px; height: 26px; }
  .head-actions { display: flex; gap: 8px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 1; }
  .tools input { flex: 1 1 260px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; height: 30px; padding: 0 12px; font: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  select.chip { appearance: auto; padding: 0 8px; }   /* keep the dropdown arrow */
  .count { color: var(--muted); font-size: 12.5px; margin: 4px 8px 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; min-height: 26px; }
  .row { grid-template-columns: 96px minmax(0, 1fr) auto; padding: 10px; }
  .thumb { width: 96px; height: 60px; }
  .thumb-play svg { width: 26px; height: 26px; }
  #more { display: flex; margin: 12px auto; }
  @media (max-width: 760px) {
    .tools { position: static; }
    .row { grid-template-columns: 64px minmax(0, 1fr); }
    .thumb { width: 64px; height: 44px; }
    .actions { grid-column: 1 / -1; flex-wrap: wrap; }
  }
</style>
</head>
<body class="page">
<div class="wrap">
  <header>
    <h1 class="brand"><img src="icons/48.png" alt="">ClipSnatcher history</h1>
    <div class="head-actions">
      <button class="btn" id="retryFailed" type="button" title="Try every failed download again" hidden></button>
      <button class="btn" id="cleanup" type="button" title="Remove entries whose file has been moved or deleted">Tidy up</button>
      <a class="btn" href="options.html" id="settings"></a>
    </div>
  </header>
  <div class="tools">
    <input type="search" id="q" aria-label="Search saved videos" placeholder="Search by title, author, site, link or note  ( / )" autofocus>
    <div class="chips" id="chips" role="group" aria-label="Filter by site">
      <button class="chip" data-site="" aria-pressed="true">All</button>
      <button class="chip" data-site="x" aria-pressed="false">X</button>
      <button class="chip" data-site="reddit" aria-pressed="false">Reddit</button>
      <button class="chip" data-site="facebook" aria-pressed="false">Facebook</button>
      <button class="chip" data-site="web" aria-pressed="false">Other</button>
    </div>
    <button class="chip" id="favs" type="button" aria-pressed="false" title="Show only favourites">&#9733; Favourites</button>
    <select id="sort" class="chip" aria-label="Sort saved videos">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="largest">Largest first</option>
      <option value="title">Title A–Z</option>
    </select>
  </div>
  <div class="count"><span id="count"></span><button class="btn small" id="clearFilters" type="button" hidden>Clear search and filter</button></div>
  <div id="list" role="list" aria-label="Saved videos"></div>
  <button class="btn" id="more" hidden>Show more</button>
</div>
<div class="notice" id="notice" role="status" hidden></div>
<script type="module" src="history.js"></script>
</body>
</html>
